server {
  listen 80;
  client_max_body_size 20m;

  # SPA
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  # API do backend (mesma origem -> sem CORS e cookie HttpOnly funciona)
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE (logs/eventos) precisa de stream sem buffer
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  # Documentacao Scalar servida pelo backend
  location /docs {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # JSON Schemas publicos (capiva.json) servidos pelo backend
  location /schemas/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Terminal web (WebSocket nativo do Bun em porta dedicada)
  location /terminal/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
